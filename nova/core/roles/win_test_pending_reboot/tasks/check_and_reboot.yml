---
- name: Running reboot recheck tasks...
  when:
    - ansible_facts.system | default('') == 'Win32NT'
    - ansible_facts.reboot_pending
  block:
    - name: Rebooting & rechecking...
      ansible.windows.win_reboot:
        reboot_timeout: 1200 # Some systems (like Microsoft Exchange) may reboot for a very long time

    - name: Re-gathering facts for {{ inventory_hostname }}...
      ansible.builtin.setup:
        gather_timeout: 60

    - name: Re-including check_and_reboot task...
      ansible.builtin.include_tasks: check_and_reboot.yml
