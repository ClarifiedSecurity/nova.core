---
- name: Restarting {{ custom_vm_name | default(vm_name) }}...
  vmware.vmware.vm_powerstate:
    name: "{{ custom_vm_name | default(vm_name) }}"
    datacenter: "{{ datacenter }}"
    state: "{{ 'reboot-guest' if powerstate_vcenter_vm_info.guests[0].summary.runtime.powerState == 'poweredOn' else 'powered-on' }}"
  retries: "{{ (powerstate_agent_info_timeout if powerstate_agent_info_timeout >= 2 else 2) // 2 }}"
  delay: 2

# Since vmware.vmware.vm_powerstate is fire-and-forget then comparing VM boot time from before and after the restart to ensure the reboot has occurred
- name: Waiting for {{ custom_vm_name | default(vm_name) }} reboot...
  vmware.vmware.vm_info:
    guest_name: "{{ custom_vm_name | default(vm_name) }}"
    schema: vsphere
    properties:
      - summary
  register: powerstate_reboot_state
  until:
    - powerstate_reboot_state.guests[0].summary.runtime.bootTime is defined
    - powerstate_reboot_state.guests[0].summary.runtime.bootTime > powerstate_vcenter_vm_info.guests[0].summary.runtime.bootTime
  retries: "{{ (powerstate_agent_info_timeout if powerstate_agent_info_timeout >= 5 else 5) // 5 }}"
  delay: 5
